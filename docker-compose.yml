services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartedu
      POSTGRES_USER: smartedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartedu-local}
    ports:
      - "5432:5432"
    volumes:
      - smartedu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartedu -d smartedu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartedu-postgres: