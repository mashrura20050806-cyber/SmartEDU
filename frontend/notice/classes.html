<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classes and sections - SmartEdu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <h1>Classes and sections</h1>
    <p class="lead">Every class and section in the school, with its class teacher and student count.</p>

    <div class="toolbar">
      <div class="field">
        <label for="class-filter">Show class</label>
        <select id="class-filter">
          <option value="">All classes</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">Class</th><th scope="col">Section</th><th scope="col">Class teacher</th><th scope="col">Students</th></tr></thead>
        <tbody id="class-rows"></tbody>
      </table>
    </div>
    <p class="empty" id="class-empty" hidden>No classes have been created yet. The admin adds classes and sections.</p>
  </main>

  <footer class="site-footer"><div class="footer-inner"><p>SmartEdu school management. Sprint 1 build.</p></div></footer>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/classes.js"></script>
</body>
</html>
