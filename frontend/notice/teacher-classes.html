<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My classes and subjects - SmartEdu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <h1>My classes and subjects</h1>
    <p class="lead">The classes, sections and subjects the admin has assigned to you.</p>
    <p id="assignment-summary"></p>

    <div class="table-wrap">
      <table id="assignment-table" hidden>
        <thead><tr><th scope="col">Class</th><th scope="col">Section</th><th scope="col">Subject</th></tr></thead>
        <tbody id="assignment-rows"></tbody>
      </table>
    </div>
    <p class="empty" id="assignment-empty" hidden>You have no assigned classes yet. Ask the admin to assign you to a class and subject.</p>
  </main>

  <footer class="site-footer"><div class="footer-inner"><p>SmartEdu school management. Sprint 1 build.</p></div></footer>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/teacher-classes.js"></script>
</body>
</html>
